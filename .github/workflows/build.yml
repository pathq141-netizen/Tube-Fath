name: Build FathTube APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleGithubDebug --no-parallel --stacktrace

      - name: Free Memory
        run: ./gradlew --stop || true

      - name: Build Release APK
        run: ./gradlew assembleGithubRelease --no-parallel --stacktrace


      - name: Prepare APKs for Upload
        run: |
          mkdir -p output_apks
          cp app/build/outputs/apk/github/debug/*.apk output_apks/FathTube-debug.apk
          cp app/build/outputs/apk/github/release/*.apk output_apks/FathTube-release.apk
          ls -la output_apks/

      - name: Upload FathTube APKs
        uses: actions/upload-artifact@v4
        with:
          name: FathTube-APKs
          path: output_apks/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Update GitHub Release Assets
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 output_apks/*.apk --clobber || \
          gh release create v1.0.0 output_apks/*.apk --title "FathTube v1.0.0" --notes "### FathTube v1.0.0 (Dev oleh Nanz)"



